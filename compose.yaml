services:
  agent:
    build: .
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AGENT_DATA_DIR: /data
      CODEX_HOME: /data/codex
    volumes:
      - agent-data:/data
    # The Worker drains in-flight agent turns for five minutes, then has a
    # short force-shutdown window. Keep Docker's deadline longer than both.
    stop_grace_period: 5m30s

volumes:
  agent-data:
